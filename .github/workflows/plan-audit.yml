name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: actions/checkout@v4
      - name: Create the GitHub OIDC deploy role (wanderzenai-ci stack, approved P2-9)
        run: |
          set +e
          mkdir out
          {
          aws cloudformation deploy --stack-name wanderzenai-ci --template-file infra/ci-oidc.yaml --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset
          echo "exit $?"
          aws cloudformation describe-stacks --stack-name wanderzenai-ci --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' --output json
          aws cloudformation describe-stack-events --stack-name wanderzenai-ci --max-items 8 --query 'StackEvents[].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' --output text
          } > out/probe.txt 2>&1
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
