name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch credited route photos through our own /photos/search
        run: |
          set +e
          mkdir -p out/img
          API=https://y44o2x9cu1.execute-api.ap-southeast-2.amazonaws.com/prod
          cat > q.txt <<'Q'
          jp-kurokawa|Kurokawa Onsen
          id-giliair|Gili Air beach
          np-chitwan|Chitwan National Park rhino
          vn-mysonruins|My Son Sanctuary Quang Nam
          Q
          echo '[' > out/manifest.json; first=1
          sed 's/^ *//' q.txt | while IFS='|' read -r key q; do
            [ -z "$key" ] && continue
            j=$(curl -s -G "$API/photos/search" --data-urlencode "query=$q")
            url=$(echo "$j" | jq -r '.data.photo.url // .photo.url // .data.url // empty')
            if [ -n "$url" ]; then
              curl -s -L "${url}&w=900&q=70&fm=jpg" -o "out/img/$key.jpg"
              [ $first = 1 ] || echo ',' >> out/manifest.json; first=0
              echo "$j" | jq -c --arg k "$key" --arg q "$q" '{key:$k,q:$q,photo:(.data.photo // .photo // .data)}' >> out/manifest.json
            else echo "MISS $key $(echo "$j" | head -c 200)" >> out/miss.txt; fi
          done
          echo ']' >> out/manifest.json
          ls -la out/img | head -40 > out/ls.txt
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm photos2
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
