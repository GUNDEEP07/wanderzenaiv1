name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: IAM probe (read-only)
        run: |
          set +e
          mkdir out
          {
          echo "== caller"; aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          U=$(aws sts get-caller-identity --query Arn --output text | sed 's#.*:user/##')
          echo "== user policies (attached)"; aws iam list-attached-user-policies --user-name "$U" --output json
          echo "== user inline"; aws iam list-user-policies --user-name "$U" --output json
          echo "== groups"; for g in $(aws iam list-groups-for-user --user-name "$U" --query 'Groups[].GroupName' --output text); do echo "group $g"; aws iam list-attached-group-policies --group-name $g --output json; aws iam list-group-policies --group-name $g --output json; done
          echo "== OIDC providers"; aws iam list-open-id-connect-providers --output json
          echo "== roles named github/deploy"; aws iam list-roles --query "Roles[?contains(RoleName,'ithub') || contains(RoleName,'deploy') || contains(RoleName,'Deploy')].RoleName" --output json
          echo "== access keys"; aws iam list-access-keys --user-name "$U" --query 'AccessKeyMetadata[].{Id:AccessKeyId,Status:Status,Created:CreateDate}' --output json
          echo "== stacks"; aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE --query 'StackSummaries[].StackName' --output json
          } > out/probe.txt 2>&1
          sed -i -E 's/(AKIA[A-Z0-9]{4})[A-Z0-9]+/\1…/g' out/probe.txt
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
