name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Probe (read-only)
        run: |
          set +e
          mkdir out
          {
          echo "== full config"; aws cloudfront get-distribution-config --id E329HHUPH0JQTP --output json
          echo "== route53"; aws route53 list-hosted-zones --output json
          for z in $(aws route53 list-hosted-zones --query "HostedZones[].Id" --output text); do aws route53 list-resource-record-sets --hosted-zone-id $z --query "ResourceRecordSets[?Type!='NS' && Type!='SOA'].{N:Name,T:Type,A:AliasTarget.DNSName,R:ResourceRecords}" --output json; done
          echo "== acm us-east-1"; aws acm list-certificates --region us-east-1 --query "CertificateSummaryList[].{Arn:CertificateArn,D:DomainName,S:SubjectAlternativeNameSummaries,St:Status}" --output json
          echo "== dig"; dig +short wanderzenai.com A; dig +short wanderzenai.com NS; dig +short www.wanderzenai.com CNAME
          } > out/probe.txt 2>&1
      - if: always()
        run: |
          set +e
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
