name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Verify ops release (env var NAMES only, never values)
        run: |
          set +e
          mkdir out
          {
          API=https://y44o2x9cu1.execute-api.ap-southeast-2.amazonaws.com/prod
          c() { echo "$1 $2 → $(curl -s -o /tmp/b -w '%{http_code}' -X $1 "$API$2" -H 'Content-Type: application/json' ${3:+-d "$3"}) $(head -c 160 /tmp/b | tr '\n' ' ')"; }
          echo "== Claude path on form-handler (/route-plan more:true, guest)"
          c POST /route-plan '{"destination":"Slovenia","days":6,"more":true,"tripPrefs":{"adults":2,"kidsAges":[]}}'
          echo "== Claude/Foursquare path on destination-insights"
          c GET "/destination-insights?destination=Kyoto&startDate=2027-03-01&endDate=2027-03-05"
          echo "== Unsplash key on recommendations"
          c GET "/photos/search?query=Hanoi"
          echo "== Foursquare on recommendations"
          c GET "/recommendations/venues?destination=Hoi%20An&lat=15.88&lng=108.33&category=Restaurants"
          echo "== watchdog schedule (last 40 min)"
          for m in Invocations Errors; do aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name $m --dimensions Name=FunctionName,Value=wanderzenai-generation-watchdog-prod --start-time $(date -u -d '-40 min' +%FT%TZ) --end-time $(date -u +%FT%TZ) --period 2400 --statistics Sum --query 'Datapoints[0].Sum' --output text | sed "s/^/$m: /"; done
          aws logs filter-log-events --log-group-name /aws/lambda/wanderzenai-generation-watchdog-prod --start-time $(( ($(date +%s) - 2400) * 1000 )) --query 'events[].message' --output text | grep -oE '"msg":"[^"]*"|Task timed out|ERROR|START|REPORT' | sort | uniq -c
          echo "== lambda errors in the account (last 40 min, per function)"
          for f in form-handler itinerary-gen pdf-builder email-sender recommendations destination-insights profile stripe-webhook generation-watchdog; do e=$(aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Errors --dimensions Name=FunctionName,Value=wanderzenai-$f-prod --start-time $(date -u -d '-40 min' +%FT%TZ) --end-time $(date -u +%FT%TZ) --period 2400 --statistics Sum --query 'Datapoints[0].Sum' --output text); echo "$f $e"; done
          echo "== alarms"
          aws cloudwatch describe-alarms --alarm-name-prefix wanderzenai-prod --query 'MetricAlarms[].[AlarmName,StateValue]' --output text
          } > out/verify.txt 2>&1
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm verify
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
