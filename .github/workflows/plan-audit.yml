name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - env:
          SK: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set +e; mkdir out
          {
          q1="metadata['wz_plan']:'trip' OR metadata['wz_plan']:'pass'"
          curl -s -u "$SK:" https://api.stripe.com/v1/products/search --get --data-urlencode "query=$q1" --data-urlencode "expand[]=data.default_price.currency_options" | jq -c '{n:(.data|length), err:.error.message, names:[.data[]?|{name, active, cur:.default_price.currency, amt:.default_price.unit_amount, opts:(.default_price.currency_options|keys?)}]}'
          q2="active:'true' AND (metadata['wz_plan']:'trip' OR metadata['wz_plan']:'pass')"
          curl -s -u "$SK:" https://api.stripe.com/v1/products/search --get --data-urlencode "query=$q2" | jq -c '{err:.error.message}'
          } > out/probe.txt 2>&1
          sed -i -E 's/sk_(test|live)_[A-Za-z0-9]+/sk_***/g' out/probe.txt
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
