name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  walk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Capture home + explore (no secrets)
        run: |
          mkdir audit && cd audit && cp ../.github/plan-audit-walk.mjs walk.mjs
          npm init -y >/dev/null && npm i playwright@1.60 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node walk.mjs
      - name: Push results to a results branch
        if: always()
        run: |
          cd audit && rm -rf node_modules package*.json walk.mjs
          git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm "ux review"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
