name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Walk the planner as a new Australian user
        run: |
          set +e; mkdir out && cd out
          npm init -y >/dev/null && npm i -s playwright@1.60.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp ../.github/plan-audit-walk.mjs walk.mjs && node walk.mjs > run.log 2>&1; echo "exit $?" >> run.log
          rm -rf node_modules package*.json walk.mjs
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm ai
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
