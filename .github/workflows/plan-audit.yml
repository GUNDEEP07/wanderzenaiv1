name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  walk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: |
          mkdir w && cd w && npm init -y >/dev/null && npm i playwright@1.60.0 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp ../.github/plan-audit-walk.mjs . && node plan-audit-walk.mjs || echo "script error $?" >> report.txt
      - if: always()
        run: |
          mkdir out && cp w/report.txt out/ 2>/dev/null; cp -r w/shots out/ 2>/dev/null
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm walk
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
