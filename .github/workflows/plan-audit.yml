name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Probe (read-only)
        run: |
          mkdir out
          {
          for u in https://wanderzenai.com/ https://www.wanderzenai.com/ https://www.wanderzenai.com/og-image.png https://www.wanderzenai.com/favicon.png https://www.wanderzenai.com/no-such-page https://www.wanderzenai.com/blog https://www.wanderzenai.com/sitemap.xml https://www.wanderzenai.com/robots.txt; do
            echo "== $u"; curl -s -o /dev/null -w "%{http_code} %{content_type} -> %{redirect_url}\n" "$u"; done
          echo "== distributions"
          aws cloudfront list-distributions --query "DistributionList.Items[].{Id:Id,Aliases:Aliases.Items,Origin:Origins.Items[0].DomainName,Domain:DomainName}" --output json
          echo "== E329 config"
          aws cloudfront get-distribution-config --id E329HHUPH0JQTP --query "DistributionConfig.{Aliases:Aliases,Origins:Origins.Items[].{D:DomainName,S3:S3OriginConfig,OAC:OriginAccessControlId,Custom:CustomOriginConfig.OriginProtocolPolicy},Default:DefaultCacheBehavior.{Fn:FunctionAssociations,Lambda:LambdaFunctionAssociations,Cache:CachePolicyId},Errors:CustomErrorResponses,Root:DefaultRootObject,Behaviors:CacheBehaviors}" --output json
          echo "== cloudfront functions"
          aws cloudfront list-functions --query "FunctionList.Items[].Name" --output json
          echo "== stack outputs"
          aws cloudformation describe-stacks --stack-name wanderzenai-prod --query "Stacks[0].Outputs" --output json 2>&1 | head -60
          echo "== stacks"; aws cloudformation list-stacks --stack-status-filter UPDATE_COMPLETE CREATE_COMPLETE --query "StackSummaries[].StackName" --output json
          } > out/probe.txt 2>&1
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
