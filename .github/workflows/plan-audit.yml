name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  gplaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-southeast-2
    steps:
      - name: Check Google Places setup (key never printed)
        run: |
          set +e; mkdir out; R=out/report.txt
          aws lambda list-functions --query "Functions[].FunctionName" --output text | tr '\t' '\n' | sort > out/functions.txt
          FN=$(grep -i "recommend" out/functions.txt | grep -i prod | head -1)
          [ -z "$FN" ] && FN=$(grep -i "recommend" out/functions.txt | head -1)
          echo "function: $FN" >> $R
          K=$(aws lambda get-function-configuration --function-name "$FN" --query "Environment.Variables.GOOGLE_PLACES_API_KEY" --output text 2>/dev/null)
          [ -n "$K" ] && [ "$K" != "None" ] && echo "::add-mask::$K"
          if [ -z "$K" ] || [ "$K" = "None" ]; then echo "key: NOT SET on the function" >> $R; else echo "key: set (length ${#K}, starts ${K:0:4}…)" >> $R; fi
          echo "stack param:" >> $R
          aws cloudformation describe-stacks --query "Stacks[?contains(StackName,'wanderzen')].{n:StackName,p:Parameters[?ParameterKey=='GooglePlacesApiKey'].ParameterValue|[0]}" --output text | sed -E 's/AIza[A-Za-z0-9_-]+/<key>/g' >> $R
          if [ -n "$K" ] && [ "$K" != "None" ]; then
            echo; echo "== legacy Places Autocomplete (what the site calls)" >> $R
            curl -s "https://maps.googleapis.com/maps/api/place/autocomplete/json?input=Queenstown&types=(cities)&key=$K" | jq -c '{status, error_message, n:(.predictions|length), first:.predictions[0].description}' >> $R
            echo "== legacy Place Details" >> $R
            PID=$(curl -s "https://maps.googleapis.com/maps/api/place/autocomplete/json?input=Queenstown&types=(cities)&key=$K" | jq -r '.predictions[0].place_id // empty')
            curl -s "https://maps.googleapis.com/maps/api/place/details/json?place_id=$PID&fields=name,geometry&key=$K" | jq -c '{status, error_message, name:.result.name}' >> $R
            echo "== Places API (New) autocomplete" >> $R
            curl -s -X POST https://places.googleapis.com/v1/places:autocomplete -H "Content-Type: application/json" -H "X-Goog-Api-Key: $K" -d '{"input":"Queenstown","includedPrimaryTypes":["locality"]}' | jq -c '{error:.error.status, msg:(.error.message//null|tostring|.[0:160]), n:(.suggestions|length), first:.suggestions[0].placePrediction.text.text}' >> $R
            echo "== Places API (New) text search, IDs only (free tier SKU)" >> $R
            curl -s -X POST https://places.googleapis.com/v1/places:searchText -H "Content-Type: application/json" -H "X-Goog-Api-Key: $K" -H "X-Goog-FieldMask: places.id" -d '{"textQuery":"Onsen Hot Pools Queenstown"}' | jq -c '{error:.error.status, msg:(.error.message//null|tostring|.[0:160]), n:(.places|length)}' >> $R
            echo "== Places API (New) details: status, rating, hours (Enterprise SKU)" >> $R
            NID=$(curl -s -X POST https://places.googleapis.com/v1/places:searchText -H "Content-Type: application/json" -H "X-Goog-Api-Key: $K" -H "X-Goog-FieldMask: places.id" -d '{"textQuery":"Onsen Hot Pools Queenstown"}' | jq -r '.places[0].id // empty')
            [ -n "$NID" ] && curl -s "https://places.googleapis.com/v1/places/$NID" -H "X-Goog-Api-Key: $K" -H "X-Goog-FieldMask: displayName,businessStatus,rating,userRatingCount,regularOpeningHours.weekdayDescriptions,photos.name" | jq -c '{error:.error.status, name:.displayName.text, businessStatus, rating, userRatingCount, hours:(.regularOpeningHours.weekdayDescriptions[0:2]), photos:(.photos|length)}' >> $R
            echo "== referrer/IP restriction hint (call without referer from GitHub IP above)" >> $R
          fi
          echo; echo "== autocomplete logs, last 14 days" >> $R
          LG=$(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/$FN" --query "logGroups[0].logGroupName" --output text)
          S=$(( ($(date +%s) - 14*86400) * 1000 ))
          for p in '"Autocomplete request"' '"from cache"' '"from fallback"' '"from Google Places"' '"no results from Google Places"' '"Autocomplete failed"' '"Failed to get place details"'; do
            c=$(aws logs filter-log-events --log-group-name "$LG" --start-time $S --filter-pattern "$p" --query "length(events)" --output text --max-items 5000 2>/dev/null | head -1)
            echo "$p: $c" >> $R
          done
          aws logs filter-log-events --log-group-name "$LG" --start-time $S --filter-pattern '"Autocomplete failed"' --max-items 3 --query "events[].message" --output text 2>/dev/null | sed -E 's/AIza[A-Za-z0-9_-]+/<key>/g' | cut -c1-400 >> $R
          aws logs filter-log-events --log-group-name "$LG" --start-time $S --filter-pattern '"no results from Google Places"' --max-items 2 --query "events[].message" --output text 2>/dev/null | sed -E 's/AIza[A-Za-z0-9_-]+/<key>/g' | cut -c1-400 >> $R
          sed -i -E 's/AIza[A-Za-z0-9_-]{20,}/<key>/g' $R
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm gp
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
