name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - id: creds
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Live AI-readability check
        run: |
          set +e; mkdir out
          B=https://www.wanderzenai.com
          {
          echo "== llms.txt"; curl -s -D - -o /tmp/l.txt $B/llms.txt | grep -iE "^HTTP|content-type|cache-control"; head -12 /tmp/l.txt; grep -c "/guides/" /tmp/l.txt
          for p in / /pricing /guides/vietnam; do
            echo "== $p JSON-LD types"; curl -s $B$p | grep -o '"@type":"[A-Za-z]*"\|"@type": "[A-Za-z]*"' | sort | uniq -c
          done
          echo "== pricing offers"; curl -s $B/pricing | grep -o '"price":"[0-9.]*","priceCurrency":"[A-Z]*"' | head
          echo "== guide best time"; curl -s $B/guides/vietnam | grep -o 'Best time: [^."]*' | head -3
          } > out/probe.txt 2>&1
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm ai
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
