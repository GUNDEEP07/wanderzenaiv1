name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - run: |
          set +e; mkdir out
          {
          curl -s -i "https://y44o2x9cu1.execute-api.ap-southeast-2.amazonaws.com/prod/pricing?country=AU" | head -30
          echo; echo "== logs"
          aws logs filter-log-events --log-group-name /aws/lambda/wanderzenai-form-handler-prod --start-time $(( ($(date +%s) - 3600) * 1000 )) --filter-pattern '"Pricing"' --query 'events[-10:].message' --output text 2>&1 | cut -c1-400
          } > out/probe.txt 2>&1
          sed -i -E 's/sk_(test|live)_[A-Za-z0-9]+/sk_***/g' out/probe.txt
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
