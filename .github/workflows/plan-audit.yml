name: Planner audit (temporary)
on:
  push:
    branches: ['smoke/plan-audit-walk']
permissions:
  contents: write
jobs:
  stripe:
    runs-on: ubuntu-24.04
    steps:
      - name: Read-only Stripe check (mode, payment links, their prices and currencies)
        env:
          SK: ${{ secrets.STRIPE_SECRET_KEY }}
          L1: ${{ secrets.STRIPE_SINGLE_PLAN_LINK }}
          L2: ${{ secrets.STRIPE_WANDERER_LINK }}
        run: |
          set +e
          mkdir out
          {
          case "$SK" in sk_live_*) echo "mode: LIVE";; sk_test_*) echo "mode: TEST";; rk_live_*) echo "mode: LIVE (restricted)";; rk_test_*) echo "mode: TEST (restricted)";; *) echo "mode: unknown";; esac
          echo "single link host/path: $(echo "$L1" | sed -E 's#https://([^/]+)/(test_)?.*#\1 \2#')"
          echo "wanderer link host/path: $(echo "$L2" | sed -E 's#https://([^/]+)/(test_)?.*#\1 \2#')"
          curl -s -u "$SK:" "https://api.stripe.com/v1/payment_links?limit=20" | jq -c '.data[]? | {id, active, url, metadata}' 
          echo "== prices"
          curl -s -u "$SK:" "https://api.stripe.com/v1/prices?limit=20&expand[]=data.product" | jq -c '.data[]? | {id, active, currency, unit_amount, type, recurring: (.recurring.interval // null), product: .product.name, currency_options: (.currency_options|keys? // null)}'
          echo "== account"
          curl -s -u "$SK:" "https://api.stripe.com/v1/account" | jq -c '{country, default_currency}'
          } > out/probe.txt 2>&1
      - if: always()
        run: |
          cd out && git init -q -b smoke/plan-audit-results && git add -A
          git -c user.name=audit -c user.email=audit@users.noreply.github.com commit -qm stripe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke/plan-audit-results
