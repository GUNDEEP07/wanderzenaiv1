name: PDF debug (temporary, read-only)
on:
  push:
    branches: ['smoke/pdf-debug']
permissions:
  contents: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Runtimes
        run: |
          for f in itinerary-gen pdf-builder email-sender; do
            aws lambda get-function-configuration --function-name wanderzenai-$f-prod --query '[FunctionName,Runtime,MemorySize,Timeout,LastUpdateStatus,EphemeralStorage.Size]' --output text
          done
      - name: Last hour of logs (emails masked)
        run: |
          START=$(( ($(date +%s) - 3600) * 1000 ))
          for f in itinerary-gen pdf-builder email-sender; do
            echo "===== $f"
            aws logs filter-log-events --log-group-name /aws/lambda/wanderzenai-$f-prod --start-time $START \
              --query 'events[].message' --output text 2>&1 \
              | tr '\t' '\n' | grep -vE '^\s*$|^START|^END' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}/<email>/g' | cut -c1-400 | tail -40
          done
