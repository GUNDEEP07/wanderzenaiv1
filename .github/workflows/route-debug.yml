name: Route debug (temporary)
on:
  push:
    branches: ['smoke/route-debug']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - name: Form handler logs (last 30 min)
        run: |
          G=$(aws logs describe-log-groups --log-group-name-prefix /aws/lambda/ --query 'logGroups[].logGroupName' --output text | tr '\t' '\n' | grep -i form | head -1)
          START=$(( ($(date +%s) - 1800) * 1000 ))
          aws logs filter-log-events --log-group-name "$G" --start-time $START \
            --filter-pattern '?route ?Route ?ERROR ?WARN ?"Task timed out" ?REPORT ?Claude' \
            --query 'events[].[timestamp,message]' --output text | cut -c1-600 | tail -60
