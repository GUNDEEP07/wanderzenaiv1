name: Live E2E (temporary)
on:
  push:
    branches: ['smoke/route-debug']
    paths-ignore: ['e2e-live/codes/**', 'e2e-live/shots/**']
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API: https://y44o2x9cu1.execute-api.ap-southeast-2.amazonaws.com/prod
      SITE: https://www.wanderzenai.com
      FIREBASE_KEY: AIzaSyDn3rruHLzzqCIWFuL0_5nwEwB69MvDTnk
      TAG: wze2e${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Live run
        run: node e2e-live/live.mjs
      - name: Publish screenshots
        if: always()
        run: |
          git config user.name e2e-bot; git config user.email e2e-bot@users.noreply.github.com
          git fetch -q origin smoke/route-debug && git reset -q --soft origin/smoke/route-debug
          git add e2e-live/shots || true
          git commit -qm "live e2e screenshots ${TAG}" && git push -q origin HEAD:smoke/route-debug || true
