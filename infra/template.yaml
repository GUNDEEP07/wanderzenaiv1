AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WanderZenAI - AI-powered slow travel itinerary platform

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref Stage
        PDF_BUCKET: !Ref PDFBucket
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        # Every function uses the database. Other secrets (Claude, Stripe, Foursquare,
        # Google Places) are set ONLY on the functions that use them (backlog P1-4, Nov 2026):
        # the blog's upload handler, for one, holds no payment or AI keys.
        DB_PASSWORD: !Ref DBPassword
        FROM_EMAIL: !Ref FromEmail
        STRIPE_SINGLE_PLAN_LINK: !Ref StripeSinglePlanLink
        STRIPE_WANDERER_LINK: !Ref StripeWandererLink
        FRONTEND_URL: !Ref FrontendUrl
        FOURSQUARE_ENABLED: !Ref FoursquareEnabled
        # Read by the shared token verifier (backend/layers/shared/nodejs/auth.js) in every function.
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
        REQUIRE_EMAIL_VERIFIED: !Ref RequireEmailVerified
        # Read by backend/layers/shared/nodejs/claude.js (MODELS).
        CLAUDE_MODEL_FAST: !Ref ClaudeModelFast
        CLAUDE_MODEL_STRONG: !Ref ClaudeModelStrong
        CLAUDE_ITINERARY_EFFORT: !Ref ClaudeItineraryEffort

    Layers:
      - !Ref SharedLayer

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  DBHost:
    Type: String
    Description: RDS Postgres host endpoint
  DBName:
    Type: String
    Default: wanderzenai
  DBUser:
    Type: String
    Default: wanderzen_admin
  DBPassword:
    Type: String
    NoEcho: true
  ClaudeApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic Claude API key
  FromEmail:
    Type: String
    Description: SES verified sender email (e.g. hello@wanderzenai.com)
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  StripeSinglePlanLink:
    Type: String
    Description: Stripe payment link for single plan
  StripeWandererLink:
    Type: String
    Description: Stripe payment link for wanderer subscription
  FrontendUrl:
    Type: String
    Description: CloudFront distribution URL for CORS
  FoursquareApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Foursquare Places API key for local venue enrichment
  UnsplashAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Unsplash Access Key, used only by the backend photo proxy (GET /photos/search). Empty = stock fallback photos.
  YoutubeApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: YouTube Data API key, used only by the backend video proxy (GET /videos/search). Empty = no videos shown.
  FoursquareEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to 'false' to disable Foursquare and use Claude-only for venue enrichment
  GooglePlacesApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google Places API key for city autocomplete
  FirebaseProjectId:
    Type: String
    Default: 'wanderzenai-9c343'
    AllowedPattern: '^[a-z0-9-]{4,40}$'
    Description: Firebase project ID — pins the aud/iss of every verified ID token. Not a secret.
  AlertEmail:
    Type: String
    Default: ''
    Description: Where ops alerts are emailed (failed/stuck trips, crashes, API errors). Empty = alarms only (visible in CloudWatch). Set from the ALERT_EMAIL repo variable; AWS emails a confirmation link first.
  RequireEmailVerified:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Reject ID tokens whose email is unverified. Only set 'false' as a temporary rollback.
  ClaudeModelFast:
    Type: String
    Default: 'claude-haiku-5-5'
    AllowedPattern: '^claude-[a-z0-9.-]+$'
    Description: Model for quick interactive calls — preview, chat, recommendations, destination insights.
  ClaudeModelStrong:
    Type: String
    Default: 'claude-opus-5-5'
    AllowedPattern: '^claude-[a-z0-9.-]+$'
    Description: Model that writes the itinerary (overview, day batches, validation repairs).
  ClaudeItineraryEffort:
    Type: String
    Default: 'medium'
    AllowedValues: ['low', 'medium', 'high', 'xhigh', 'max']
    Description: How hard the itinerary model thinks (5.x models only). Higher = better plans, slower and more output tokens.
  AllowedOrigins:
    Type: String
    Default: 'https://www.wanderzenai.com,http://localhost:5173,https://localhost:5173,https://web.postman.co'
    Description: Comma-separated list of allowed origins for recommendations endpoint


  # The live site's domain and its certificate (ACM, us-east-1). Both were set on the
  # distribution by hand before Nov 2026; they are declared here so a stack update can never
  # drop them. Leave the certificate empty for a stack without a custom domain.
  FrontendDomain:
    Type: String
    Default: www.wanderzenai.com
  FrontendCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:595710543932:certificate/cbe22f14-66f2-4a37-ad96-01d92fd1a6f5

Conditions:
  HasFrontendDomain: !Not [!Equals [!Ref FrontendCertificateArn, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:

  # ─── API Gateway ───────────────────────────────────────────────────────────
  WanderZenApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub wanderzenai-api-${Stage}
      StageName: !Ref Stage
      Cors:
        # PUT/DELETE are used by /profile and /blog; without them browser preflight fails.
        AllowMethods: "'POST,GET,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Stripe-Signature'"
        # Only our site may call the API from a browser (backlog P2-10, Nov 2026). Server-to-server
        # callers (Stripe webhooks, CI checks) send no Origin and are unaffected.
        AllowOrigin: !Sub "'${FrontendUrl}'"
      Auth:
        DefaultAuthorizer: NONE
      # Coarse, stage-wide throttling: a ceiling on total spend no matter who is calling.
      # Per-user limits live in the rate_limits table; per-IP limits in WanderZenWebAcl.
      # ResourcePath encodes '/' as '~1' (CloudFormation MethodSetting format).
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        - ResourcePath: '/~1submit'
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5
        - ResourcePath: '/~1preview'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        - ResourcePath: '/~1route-plan'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        # Polled every ~4 s by the confirmation page while a trip is written; no Claude call.
        - ResourcePath: '/~1itinerary~1{id}~1progress'
          HttpMethod: GET
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20
        - ResourcePath: '/~1recommendations~1chat'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        - ResourcePath: '/~1welcome-email'
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 3
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

  # ─── Lambda Layer (shared utilities) ───────────────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub wanderzenai-shared-${Stage}
      ContentUri: ../backend/layers/shared
      CompatibleRuntimes: [nodejs24.x]
      RetentionPolicy: Delete

  # ─── Form Handler Lambda ───────────────────────────────────────────────────
  FormHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-form-handler-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: index.handler
      Description: Receives form submissions, validates, stores to DB, triggers itinerary generation
      Environment:
        Variables:
          CLAUDE_API_KEY: !Ref ClaudeApiKey  # /preview and /route-plan
          STRIPE_SECRET_KEY: !Ref StripeSecretKey  # GET /pricing reads prices + payment links (read only)
      Events:
        Pricing:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: GET
            Path: /pricing
        PreviewSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /preview
        RoutePlan:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /route-plan
        GenerationProgress:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: GET
            Path: /itinerary/{id}/progress
        FormSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /submit
        Entitlement:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: GET
            Path: /entitlement
        DayAdjustments:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: GET
            Path: /itinerary/{id}/adjustments
        AdjustDay:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /itinerary/{id}/days/{day}/adjust
        PdfLink:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: GET
            Path: /itinerary/{id}/pdf
        # Free trips show Day 1; the owner unlocks the rest with a paid itinerary (unlock.js).
        UnlockTrip:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /itinerary/{id}/unlock
      Policies:
        # GET /itinerary/{id}/pdf signs a short-lived link to the owner's PDF.
        - S3ReadPolicy:
            BucketName: !Ref PDFBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource:
                - !GetAtt ItineraryGenFunction.Arn
                - !GetAtt PDFBuilderFunction.Arn  # full PDF after an unlock

  # ─── Welcome Email Lambda ─────────────────────────────────────────────────
  WelcomeEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-welcome-email-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: welcome-email.handler
      Timeout: 10
      MemorySize: 256
      Description: Sends welcome email via SES when a new user signs up
      Events:
        WelcomeEmail:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /welcome-email
            Method: POST
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: '*'

  # ─── Itinerary Generator Lambda ────────────────────────────────────────────
  ItineraryGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-itinerary-gen-${Stage}
      CodeUri: ../backend/functions/itinerary-gen
      Handler: index.handler
      # Opus writes day batches in parallel; long trips plus validation repairs can take
      # several minutes. 900 s is the Lambda maximum.
      Timeout: 900
      MemorySize: 1024
      Description: Calls Claude API with slow-travel prompt, parses structured JSON, stores itinerary
      Environment:
        Variables:
          CLAUDE_API_KEY: !Ref ClaudeApiKey
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
      # No automatic retry: a re-run would pay for a second Opus generation. A crash goes
      # to the watchdog, which fails the trip once, gives the itinerary back and emails.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !GetAtt GenerationWatchdogFunction.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt PDFBuilderFunction.Arn
            # "We couldn't finish your itinerary" email when generation fails (failure.js).
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: '*'

  # ─── PDF Builder Lambda ────────────────────────────────────────────────────
  PDFBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-pdf-builder-${Stage}
      CodeUri: ../backend/functions/pdf-builder
      Handler: index.handler
      Timeout: 120
      MemorySize: 2048
      Description: Renders itinerary HTML template to PDF via Puppeteer, uploads to S3
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !GetAtt GenerationWatchdogFunction.Arn
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PDFBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt EmailSenderFunction.Arn
    Metadata:
      BuildMethod: nodejs24.x

  # ─── Generation watchdog (backlog P1-7) ───────────────────────────────────
  # Receives crashed invocations of the trip chain (OnFailure destinations above) and, every
  # 10 minutes, fails trips stuck unfinished — refund + traveller email via failure.js.
  GenerationWatchdogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-generation-watchdog-${Stage}
      CodeUri: ../backend/functions/itinerary-gen
      Handler: watchdog.handler
      Timeout: 60
      MemorySize: 256
      Description: Fails crashed or stuck trips once (refund + email) and counts them for alarms
      Events:
        Sweep:
          Type: Schedule
          Properties:
            Schedule: rate(10 minutes)
            Name: !Sub wanderzenai-generation-watchdog-${Stage}
            Description: Fail trips stuck unfinished for 20+ minutes
            Enabled: true
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: '*'

  # ─── Ops alerts ─────────────────────────────────────────────────────────────
  # Counters come from the code (layers/shared/nodejs/metrics.js, namespace WanderZenAI) plus
  # AWS's own Lambda and API Gateway metrics. Any alarm emails AlertEmail (after it confirms).
  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub wanderzenai-ops-alerts-${Stage}
      DisplayName: WanderZenAI alerts

  OpsAlertsEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  TripFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wanderzenai-${Stage}-trip-failed
      AlarmDescription: A trip could not be generated (the traveller was refunded and emailed). Check itinerary-gen logs.
      Namespace: WanderZenAI
      MetricName: TripFailed
      Dimensions: [{ Name: Stage, Value: !Ref Stage }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  DeliveryFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wanderzenai-${Stage}-delivery-failed
      AlarmDescription: A PDF could not be built or a trip email did not send. Check pdf-builder / email-sender logs.
      Metrics:
        - Id: pdf
          ReturnData: false
          MetricStat:
            Metric: { Namespace: WanderZenAI, MetricName: PdfFailed, Dimensions: [{ Name: Stage, Value: !Ref Stage }] }
            Period: 300
            Stat: Sum
        - Id: mail
          ReturnData: false
          MetricStat:
            Metric: { Namespace: WanderZenAI, MetricName: EmailFailed, Dimensions: [{ Name: Stage, Value: !Ref Stage }] }
            Period: 300
            Stat: Sum
        - Id: adjust
          ReturnData: false
          MetricStat:
            Metric: { Namespace: WanderZenAI, MetricName: DayAdjustFailed, Dimensions: [{ Name: Stage, Value: !Ref Stage }] }
            Period: 300
            Stat: Sum
        - Id: total
          Expression: FILL(pdf, 0) + FILL(mail, 0) + FILL(adjust, 0)
          Label: Delivery failures
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  ChainCrashAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wanderzenai-${Stage}-chain-crash-or-stuck
      AlarmDescription: A trip-chain Lambda crashed (timeout, memory, start-up) or a trip was stuck 20+ minutes. The watchdog failed and refunded it; find the cause in the watchdog logs.
      Metrics:
        - Id: crash
          ReturnData: false
          MetricStat:
            Metric: { Namespace: WanderZenAI, MetricName: AsyncCrash, Dimensions: [{ Name: Stage, Value: !Ref Stage }] }
            Period: 300
            Stat: Sum
        - Id: stuck
          ReturnData: false
          MetricStat:
            Metric: { Namespace: WanderZenAI, MetricName: StuckTrip, Dimensions: [{ Name: Stage, Value: !Ref Stage }] }
            Period: 300
            Stat: Sum
        - Id: total
          Expression: FILL(crash, 0) + FILL(stuck, 0)
          Label: Crashed or stuck trips
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wanderzenai-${Stage}-lambda-errors
      AlarmDescription: Lambda functions in this account and region threw unhandled errors (3+ in 5 minutes).
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub wanderzenai-${Stage}-api-5xx
      AlarmDescription: The API returned 5+ server errors in 5 minutes (database down, a handler bug, a dependency outage).
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - { Name: ApiName, Value: !Sub 'wanderzenai-api-${Stage}' }
        - { Name: Stage, Value: !Ref Stage }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]

  # ─── Email Sender Lambda ───────────────────────────────────────────────────
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-email-sender-${Stage}
      CodeUri: ../backend/functions/email-sender
      Handler: index.handler
      Description: Sends branded email with signed S3 PDF download link via SES
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: Lambda
            Destination: !GetAtt GenerationWatchdogFunction.Arn
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: '*'
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub arn:aws:s3:::${PDFBucket}/*

  # ─── Stripe Webhook Lambda ─────────────────────────────────────────────────
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-stripe-webhook-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: stripe-webhook.handler
      Description: Confirms Stripe payments, unlocks itinerary generation for paid users
      Environment:
        Variables:
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      Events:
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /webhook/stripe
            Method: POST

  # ─── Get Itinerary Lambda (dashboard) ─────────────────────────────────────
  GetItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-get-itinerary-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: get-itinerary.handler
      Description: Returns stored itinerary data for user dashboard
      Events:
        GetItinerary:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /itinerary/{id}
            Method: GET

  # ─── Weekly Cache Refresh Lambda (cron) ──────────────────────────────────────
  WeeklyCacheFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-weekly-cache-${Stage}
      CodeUri: ../backend/functions/weekly-cache
      Handler: index.handler
      Timeout: 900
      MemorySize: 512
      Description: Runs every Sunday — fetches Foursquare + Amadeus data and populates recommendations_cache
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
      Events:
        WeeklyCronJob:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 ? * SUN *)
            Name: !Sub wanderzenai-weekly-cache-${Stage}
            Description: Weekly destination cache refresh — Sunday midnight AEST
            Enabled: true

  # ─── Recommendations Lambda ────────────────────────────────────────────────
  RecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-recommendations-${Stage}
      CodeUri: ../backend/functions/recommendations
      Handler: index.handler
      Timeout: 25
      # 512 MB: answers the destination search box and landing stats; faster cold starts.
      MemorySize: 512
      Description: Provides destination autocomplete and venue discovery via Foursquare API
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          FRONTEND_URL: !Ref FrontendUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          CLAUDE_API_KEY: !Ref ClaudeApiKey
          UNSPLASH_ACCESS_KEY: !Ref UnsplashAccessKey
          YOUTUBE_API_KEY: !Ref YoutubeApiKey
          GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
      Events:
        GetPhotoSearch:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /photos/search
            Method: GET
        GetPlaceIdeas:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /places/ideas
            Method: GET
        GetPlacePhoto:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /places/photo
            Method: GET
        GetVideoSearch:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /videos/search
            Method: GET
        GetAutocomplete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/autocomplete
            Method: GET
        GetVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/venues
            Method: GET
        GetCategories:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/categories
            Method: GET
        GetPublicStats:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/public/stats
            Method: GET
        GetTrending:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/trending
            Method: GET
        GetPersonalised:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/personalised
            Method: GET
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/chat
            Method: POST

  # ─── Destination Insights Lambda ──────────────────────────────────────────
  DestinationInsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-destination-insights-${Stage}
      CodeUri: ../backend/functions/destination-insights
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      Description: Generates destination insights via Foursquare (primary) and Claude (fallback)
      Environment:
        Variables:
          CLAUDE_API_KEY: !Ref ClaudeApiKey
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
      Events:
        GetDestinationInsights:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /destination-insights
            Method: GET

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-profile-${Stage}
      CodeUri: ../backend/functions/profile
      Handler: handler.handler
      Timeout: 15
      # 512 MB: Lambda CPU scales with memory; at 256 MB a cold start took ~3 s (Nov 2026).
      MemorySize: 512
      Description: GET and PUT user profile + past trips
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
      Environment:
        Variables:
          DB_HOST:           !Ref DBHost
          DB_NAME:           !Ref DBName
          DB_USER:           !Ref DBUser
          DB_PASSWORD:       !Ref DBPassword
          PDF_BUCKET:        !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL:      !Ref FrontendUrl
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile
            Method: GET
        PutProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile
            Method: PUT
        GetPlanDraft:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile/draft
            Method: GET
        PutPlanDraft:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile/draft
            Method: PUT
        DeletePlanDraft:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile/draft
            Method: DELETE
        GetItinerary:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /itinerary
            Method: GET
        PostCustomerPortal:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /customer-portal
            Method: POST

  # ─── Admin Lambda ─────────────────────────────────────────────────────────
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-admin-${Stage}
      CodeUri: ../backend/functions/admin
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      Description: Admin monitoring portal API — role-protected with verified Firebase JWT
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
      Events:
        AdminProxy:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /admin/{proxy+}
            Method: ANY
        AdminRoot:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /admin
            Method: ANY

  # ─── Blog Handler Lambda ──────────────────────────────────────────────────
  BlogHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-blog-handler-${Stage}
      CodeUri: ../backend/functions/blog-handler
      Handler: index.handler
      Timeout: 30
      MemorySize: 512
      Description: Handles blog posts, comments, photos, and moderation workflows
      # Story photos live privately under blog/ in the PDF bucket (served via signed URLs).
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
              Resource: !Sub arn:aws:s3:::${PDFBucket}/blog/*
      Events:
        # ─── Posts Routes ─────────────────────────────────────────────────────
        PostCreate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog
            Method: POST
        PostList:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog
            Method: GET
        PostGet:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: GET
        PostUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: PUT
        PostDelete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: DELETE
        # ─── Comments Routes ──────────────────────────────────────────────────
        CommentList:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/comments
            Method: GET
        CommentCreate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/comments
            Method: POST
        CommentUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/comments/{commentId}
            Method: PUT
        CommentDelete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/comments/{commentId}
            Method: DELETE
        # ─── Photos Routes ────────────────────────────────────────────────────
        PhotosList:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos
            Method: GET
        PhotoUpload:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos
            Method: POST
        PhotoUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos/{photoId}
            Method: PUT
        PhotoDelete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos/{photoId}
            Method: DELETE
        # ─── Admin Routes ─────────────────────────────────────────────────────
        PostApprove:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/approve
            Method: POST  # matches frontend/src/api/blog.js
        PostReject:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/reject
            Method: POST  # matches frontend/src/api/blog.js
        AdminPending:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/admin/pending
            Method: GET

  # ─── WAF: per-IP rate limits in front of API Gateway ──────────────────────
  # Rate-based rules count requests per source IP over a rolling 5-minute window.
  # Cost: ~US$5/month for the ACL + ~US$1/month per rule + US$0.60 per million requests.
  WanderZenWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub wanderzenai-api-${Stage}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub wanderzenai-api-${Stage}
      Rules:
        - Name: AmazonIpReputationList
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
        - Name: RateLimitAiEndpoints
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              Limit: 100  # requests per 5 minutes per IP
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        SearchString: /submit
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /preview
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /route-plan
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /recommendations/chat
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /recommendations/trending
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /destination-insights
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /welcome-email
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-ai
        - Name: RateLimitAll
          Priority: 2
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              Limit: 1000  # requests per 5 minutes per IP, any route
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-all

  WanderZenWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn: !GetAtt WanderZenWebAcl.Arn
      # WanderZenApi.Stage is the SAM-generated stage; referencing it orders this after the stage exists.
      ResourceArn: !Join
        - ''
        - - 'arn:aws:apigateway:'
          - !Ref AWS::Region
          - '::/restapis/'
          - !Ref WanderZenApi
          - '/stages/'
          - !Ref WanderZenApi.Stage

  # ─── S3 Bucket for PDFs ────────────────────────────────────────────────────
  PDFBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldFreePDFs
            Status: Enabled
            ExpirationInDays: 90
            TagFilters:
              - Key: plan
                Value: free
          - Id: DeleteOldPaidPDFs
            Status: Enabled
            ExpirationInDays: 365
            TagFilters:
              - Key: plan
                Value: paid
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: [!Ref FrontendUrl]
            MaxAge: 3600

  # ─── S3 Bucket for Frontend ────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wanderzenai-frontend-${Stage}-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

  # ─── CloudFront Distribution ───────────────────────────────────────────────
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: WanderZenAI Frontend OAI

  # Clean addresses (SEO, Nov 2026): public pages are prerendered to <path>/index.html at
  # build time (frontend/scripts/prerender.mjs); app pages get the plain app shell; anything
  # else that doesn't exist falls through to 404.html with a real 404 status (below).
  # Tested by frontend/src/seo/rewrite.test.js, which runs THIS code.
  FrontendRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub wanderzenai-frontend-rewrite-${Stage}
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URLs to prerendered pages; app routes to the shell
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var APP = /^\/(plan|dashboard|settings|onboarding|confirmation|agency|login|signup|admin|itinerary)(\/|$)/;
        function query(qs) {
          var parts = [];
          for (var k in qs) {
            var v = qs[k];
            var vals = v.multiValue ? v.multiValue : [v];
            for (var i = 0; i < vals.length; i++) parts.push(k + (vals[i].value === '' ? '' : '=' + vals[i].value));
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri === '/' || uri === '') { req.uri = '/index.html'; return req; }
          var last = uri.substring(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') !== -1) return req;
          if (uri.charAt(uri.length - 1) === '/') {
            var to = uri.replace(/\/+$/, '') || '/';
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: to + query(req.querystring) }, 'cache-control': { value: 'public, max-age=3600' } } };
          }
          if (APP.test(uri)) { req.uri = '/_shell.html'; return req; }
          req.uri = uri + '/index.html';
          return req;
        }

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: !If [HasFrontendDomain, [!Ref FrontendDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasFrontendDomain
          - AcmCertificateArn: !Ref FrontendCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        IPV6Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOAI}
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendRewriteFunction.FunctionMetadata.FunctionARN
        # A missing page is a real 404 (S3 answers 403 for a missing key: no ListBucket). The
        # 404 page is the app too, so a story published since the last build still opens.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${WanderZenApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  PDFBucketName:
    Description: S3 bucket for PDF storage
    Value: !Ref PDFBucket
    Export:
      Name: !Sub ${AWS::StackName}-PDFBucket

  FrontendBucketName:
    Description: S3 bucket name for frontend hosting
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  FrontendBucketUrl:
    Description: S3 website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
