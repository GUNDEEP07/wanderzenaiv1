AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WanderZenAI - AI-powered slow travel itinerary platform

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref Stage
        PDF_BUCKET: !Ref PDFBucket
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        CLAUDE_API_KEY: !Ref ClaudeApiKey
        FROM_EMAIL: !Ref FromEmail
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
        STRIPE_SINGLE_PLAN_LINK: !Ref StripeSinglePlanLink
        STRIPE_WANDERER_LINK: !Ref StripeWandererLink
        FRONTEND_URL: !Ref FrontendUrl
        FOURSQUARE_API_KEY: !Ref FoursquareApiKey
        FOURSQUARE_ENABLED: !Ref FoursquareEnabled
        GOOGLE_PLACES_API_KEY: !Ref GooglePlacesApiKey
        # Read by the shared token verifier (backend/layers/shared/nodejs/auth.js) in every function.
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
        REQUIRE_EMAIL_VERIFIED: !Ref RequireEmailVerified
        # Read by backend/layers/shared/nodejs/claude.js (MODELS).
        CLAUDE_MODEL_FAST: !Ref ClaudeModelFast
        CLAUDE_MODEL_STRONG: !Ref ClaudeModelStrong
        CLAUDE_ITINERARY_EFFORT: !Ref ClaudeItineraryEffort

    Layers:
      - !Ref SharedLayer

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  DBHost:
    Type: String
    Description: RDS Postgres host endpoint
  DBName:
    Type: String
    Default: wanderzenai
  DBUser:
    Type: String
    Default: wanderzen_admin
  DBPassword:
    Type: String
    NoEcho: true
  ClaudeApiKey:
    Type: String
    NoEcho: true
    Description: Anthropic Claude API key
  FromEmail:
    Type: String
    Description: SES verified sender email (e.g. hello@wanderzenai.com)
  StripeSecretKey:
    Type: String
    NoEcho: true
  StripeWebhookSecret:
    Type: String
    NoEcho: true
  StripeSinglePlanLink:
    Type: String
    Description: Stripe payment link for single plan
  StripeWandererLink:
    Type: String
    Description: Stripe payment link for wanderer subscription
  FrontendUrl:
    Type: String
    Description: CloudFront distribution URL for CORS
  FoursquareApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Foursquare Places API key for local venue enrichment
  UnsplashAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Unsplash Access Key, used only by the backend photo proxy (GET /photos/search). Empty = stock fallback photos.
  YoutubeApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: YouTube Data API key, used only by the backend video proxy (GET /videos/search). Empty = no videos shown.
  FoursquareEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to 'false' to disable Foursquare and use Claude-only for venue enrichment
  GooglePlacesApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google Places API key for city autocomplete
  FirebaseProjectId:
    Type: String
    Default: 'wanderzenai-9c343'
    AllowedPattern: '^[a-z0-9-]{4,40}$'
    Description: Firebase project ID — pins the aud/iss of every verified ID token. Not a secret.
  RequireEmailVerified:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Reject ID tokens whose email is unverified. Only set 'false' as a temporary rollback.
  ClaudeModelFast:
    Type: String
    Default: 'claude-haiku-5-5'
    AllowedPattern: '^claude-[a-z0-9.-]+$'
    Description: Model for quick interactive calls — preview, chat, recommendations, destination insights.
  ClaudeModelStrong:
    Type: String
    Default: 'claude-opus-5-5'
    AllowedPattern: '^claude-[a-z0-9.-]+$'
    Description: Model that writes the itinerary (overview, day batches, validation repairs).
  ClaudeItineraryEffort:
    Type: String
    Default: 'medium'
    AllowedValues: ['low', 'medium', 'high', 'xhigh', 'max']
    Description: How hard the itinerary model thinks (5.x models only). Higher = better plans, slower and more output tokens.
  AllowedOrigins:
    Type: String
    Default: 'https://www.wanderzenai.com,http://localhost:5173,https://localhost:5173,https://web.postman.co'
    Description: Comma-separated list of allowed origins for recommendations endpoint


Resources:

  # ─── API Gateway ───────────────────────────────────────────────────────────
  WanderZenApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub wanderzenai-api-${Stage}
      StageName: !Ref Stage
      Cors:
        # PUT/DELETE are used by /profile and /blog; without them browser preflight fails.
        AllowMethods: "'POST,GET,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Stripe-Signature'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: NONE
      # Coarse, stage-wide throttling: a ceiling on total spend no matter who is calling.
      # Per-user limits live in the rate_limits table; per-IP limits in WanderZenWebAcl.
      # ResourcePath encodes '/' as '~1' (CloudFormation MethodSetting format).
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 25
          ThrottlingBurstLimit: 50
        - ResourcePath: '/~1submit'
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5
        - ResourcePath: '/~1preview'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        - ResourcePath: '/~1route-plan'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        - ResourcePath: '/~1recommendations~1chat'
          HttpMethod: POST
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 10
        - ResourcePath: '/~1welcome-email'
          HttpMethod: POST
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 3
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              gatewayresponse.header.Access-Control-Allow-Origin: "'*'"

  # ─── Lambda Layer (shared utilities) ───────────────────────────────────────
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub wanderzenai-shared-${Stage}
      ContentUri: ../backend/layers/shared
      CompatibleRuntimes: [nodejs20.x]
      RetentionPolicy: Delete

  # ─── Form Handler Lambda ───────────────────────────────────────────────────
  FormHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-form-handler-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: index.handler
      Description: Receives form submissions, validates, stores to DB, triggers itinerary generation
      Events:
        PreviewSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /preview
        RoutePlan:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /route-plan
        FormSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Method: POST
            Path: /submit
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt ItineraryGenFunction.Arn

  # ─── Welcome Email Lambda ─────────────────────────────────────────────────
  WelcomeEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-welcome-email-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: welcome-email.handler
      Timeout: 10
      MemorySize: 256
      Description: Sends welcome email via SES when a new user signs up
      Events:
        WelcomeEmail:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /welcome-email
            Method: POST
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: '*'

  # ─── Itinerary Generator Lambda ────────────────────────────────────────────
  ItineraryGenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-itinerary-gen-${Stage}
      CodeUri: ../backend/functions/itinerary-gen
      Handler: index.handler
      # Opus writes day batches in parallel; long trips plus validation repairs can take
      # several minutes. 900 s is the Lambda maximum.
      Timeout: 900
      MemorySize: 1024
      Description: Calls Claude API with slow-travel prompt, parses structured JSON, stores itinerary
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt PDFBuilderFunction.Arn
            # "We couldn't finish your itinerary" email when generation fails (failure.js).
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: '*'

  # ─── PDF Builder Lambda ────────────────────────────────────────────────────
  PDFBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-pdf-builder-${Stage}
      CodeUri: ../backend/functions/pdf-builder
      Handler: index.handler
      Timeout: 120
      MemorySize: 2048
      Description: Renders itinerary HTML template to PDF via Puppeteer, uploads to S3
      Policies:
        - S3WritePolicy:
            BucketName: !Ref PDFBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !GetAtt EmailSenderFunction.Arn
    Metadata:
      BuildMethod: nodejs20.x

  # ─── Email Sender Lambda ───────────────────────────────────────────────────
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-email-sender-${Stage}
      CodeUri: ../backend/functions/email-sender
      Handler: index.handler
      Description: Sends branded email with signed S3 PDF download link via SES
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: '*'
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub arn:aws:s3:::${PDFBucket}/*

  # ─── Stripe Webhook Lambda ─────────────────────────────────────────────────
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-stripe-webhook-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: stripe-webhook.handler
      Description: Confirms Stripe payments, unlocks itinerary generation for paid users
      Events:
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /webhook/stripe
            Method: POST

  # ─── Get Itinerary Lambda (dashboard) ─────────────────────────────────────
  GetItineraryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-get-itinerary-${Stage}
      CodeUri: ../backend/functions/form-handler
      Handler: get-itinerary.handler
      Description: Returns stored itinerary data for user dashboard
      Events:
        GetItinerary:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /itinerary/{id}
            Method: GET

  # ─── Weekly Cache Refresh Lambda (cron) ──────────────────────────────────────
  WeeklyCacheFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-weekly-cache-${Stage}
      CodeUri: ../backend/functions/weekly-cache
      Handler: index.handler
      Timeout: 900
      MemorySize: 512
      Description: Runs every Sunday — fetches Foursquare + Amadeus data and populates recommendations_cache
      Events:
        WeeklyCronJob:
          Type: Schedule
          Properties:
            Schedule: cron(0 14 ? * SUN *)
            Name: !Sub wanderzenai-weekly-cache-${Stage}
            Description: Weekly destination cache refresh — Sunday midnight AEST
            Enabled: true

  # ─── Recommendations Lambda ────────────────────────────────────────────────
  RecommendationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-recommendations-${Stage}
      CodeUri: ../backend/functions/recommendations
      Handler: index.handler
      Timeout: 25
      MemorySize: 256
      Description: Provides destination autocomplete and venue discovery via Foursquare API
      Environment:
        Variables:
          FOURSQUARE_API_KEY: !Ref FoursquareApiKey
          FRONTEND_URL: !Ref FrontendUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          CLAUDE_API_KEY: !Ref ClaudeApiKey
          UNSPLASH_ACCESS_KEY: !Ref UnsplashAccessKey
          YOUTUBE_API_KEY: !Ref YoutubeApiKey
      Events:
        GetPhotoSearch:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /photos/search
            Method: GET
        GetVideoSearch:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /videos/search
            Method: GET
        GetAutocomplete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/autocomplete
            Method: GET
        GetVenues:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/venues
            Method: GET
        GetCategories:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/categories
            Method: GET
        GetPublicStats:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/public/stats
            Method: GET
        GetTrending:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/trending
            Method: GET
        GetPersonalised:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/personalised
            Method: GET
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /recommendations/chat
            Method: POST

  # ─── Destination Insights Lambda ──────────────────────────────────────────
  DestinationInsightsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-destination-insights-${Stage}
      CodeUri: ../backend/functions/destination-insights
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      Description: Generates destination insights via Foursquare (primary) and Claude (fallback)
      Events:
        GetDestinationInsights:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /destination-insights
            Method: GET

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-profile-${Stage}
      CodeUri: ../backend/functions/profile
      Handler: handler.handler
      Timeout: 15
      MemorySize: 256
      Description: GET and PUT user profile + past trips
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
      Environment:
        Variables:
          DB_HOST:           !Ref DBHost
          DB_NAME:           !Ref DBName
          DB_USER:           !Ref DBUser
          DB_PASSWORD:       !Ref DBPassword
          PDF_BUCKET:        !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          FRONTEND_URL:      !Ref FrontendUrl
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile
            Method: GET
        PutProfile:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /profile
            Method: PUT
        GetItinerary:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /itinerary
            Method: GET
        PostCustomerPortal:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /customer-portal
            Method: POST

  # ─── Admin Lambda ─────────────────────────────────────────────────────────
  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-admin-${Stage}
      CodeUri: ../backend/functions/admin
      Handler: handler.handler
      Timeout: 30
      MemorySize: 512
      Description: Admin monitoring portal API — role-protected with verified Firebase JWT
      Environment:
        Variables:
          FIREBASE_PROJECT_ID: !Ref FirebaseProjectId
      Events:
        AdminProxy:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /admin/{proxy+}
            Method: ANY
        AdminRoot:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /admin
            Method: ANY

  # ─── Blog Handler Lambda ──────────────────────────────────────────────────
  BlogHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub wanderzenai-blog-handler-${Stage}
      CodeUri: ../backend/functions/blog-handler
      Handler: index.handler
      Timeout: 30
      MemorySize: 512
      Description: Handles blog posts, comments, photos, and moderation workflows
      Events:
        # ─── Posts Routes ─────────────────────────────────────────────────────
        PostCreate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog
            Method: POST
        PostList:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog
            Method: GET
        PostGet:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: GET
        PostUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: PUT
        PostDelete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}
            Method: DELETE
        # ─── Comments Routes ──────────────────────────────────────────────────
        CommentCreate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/comments
            Method: POST
        CommentUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/comments/{commentId}
            Method: PUT
        CommentDelete:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/comments/{commentId}
            Method: DELETE
        # ─── Photos Routes ────────────────────────────────────────────────────
        PhotosList:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos
            Method: GET
        PhotoRequest:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos/request
            Method: POST
        PhotoConfirm:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/photos/confirm
            Method: POST
        # ─── Admin Routes ─────────────────────────────────────────────────────
        PostApprove:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/approve
            Method: POST  # matches frontend/src/api/blog.js
        PostReject:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/{id}/reject
            Method: POST  # matches frontend/src/api/blog.js
        AdminPending:
          Type: Api
          Properties:
            RestApiId: !Ref WanderZenApi
            Path: /blog/admin/pending
            Method: GET

  # ─── WAF: per-IP rate limits in front of API Gateway ──────────────────────
  # Rate-based rules count requests per source IP over a rolling 5-minute window.
  # Cost: ~US$5/month for the ACL + ~US$1/month per rule + US$0.60 per million requests.
  WanderZenWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub wanderzenai-api-${Stage}
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub wanderzenai-api-${Stage}
      Rules:
        - Name: AmazonIpReputationList
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ip-reputation
        - Name: RateLimitAiEndpoints
          Priority: 1
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              Limit: 100  # requests per 5 minutes per IP
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        SearchString: /submit
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /preview
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /route-plan
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /recommendations/chat
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /recommendations/trending
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /destination-insights
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
                    - ByteMatchStatement:
                        SearchString: /welcome-email
                        FieldToMatch: { UriPath: {} }
                        PositionalConstraint: CONTAINS
                        TextTransformations: [{ Priority: 0, Type: LOWERCASE }]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-ai
        - Name: RateLimitAll
          Priority: 2
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          Statement:
            RateBasedStatement:
              Limit: 1000  # requests per 5 minutes per IP, any route
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-all

  WanderZenWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn: !GetAtt WanderZenWebAcl.Arn
      # WanderZenApi.Stage is the SAM-generated stage; referencing it orders this after the stage exists.
      ResourceArn: !Join
        - ''
        - - 'arn:aws:apigateway:'
          - !Ref AWS::Region
          - '::/restapis/'
          - !Ref WanderZenApi
          - '/stages/'
          - !Ref WanderZenApi.Stage

  # ─── S3 Bucket for PDFs ────────────────────────────────────────────────────
  PDFBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wanderzenai-pdfs-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldFreePDFs
            Status: Enabled
            ExpirationInDays: 90
            TagFilters:
              - Key: plan
                Value: free
          - Id: DeleteOldPaidPDFs
            Status: Enabled
            ExpirationInDays: 365
            TagFilters:
              - Key: plan
                Value: paid
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET]
            AllowedOrigins: [!Ref FrontendUrl]
            MaxAge: 3600

  # ─── S3 Bucket for Frontend ────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub wanderzenai-frontend-${Stage}-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

  # ─── CloudFront Distribution ───────────────────────────────────────────────
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: WanderZenAI Frontend OAI

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOAI}
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub https://${WanderZenApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  CloudFrontUrl:
    Description: CloudFront distribution URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  PDFBucketName:
    Description: S3 bucket for PDF storage
    Value: !Ref PDFBucket
    Export:
      Name: !Sub ${AWS::StackName}-PDFBucket

  FrontendBucketName:
    Description: S3 bucket name for frontend hosting
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  FrontendBucketUrl:
    Description: S3 website URL
    Value: !GetAtt FrontendBucket.WebsiteURL
